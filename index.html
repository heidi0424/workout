<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="訓練三軌追蹤" />
  <meta name="theme-color" content="#1e293b" />
  <title>每週訓練菜單與三軌追蹤系統（2026/11/12 – 2026/11/18）</title>
  <style>
    :root {
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --navy-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --sky-700: #0369a1;
      --sky-200: #bae6fd;
      --sky-50: #eff6ff;
      --rose-700: #be123c;
      --rose-200: #fecdd3;
      --rose-50: #fff1f2;
      --violet-700: #6d28d9;
      --violet-200: #ddd6fe;
      --violet-50: #f5f3ff;
      --amber-800: #92400e;
      --amber-200: #fde68a;
      --amber-50: #fffbeb;
      --orange-700: #c2410c;
      --orange-200: #fed7aa;
      --orange-50: #fff7ed;
      --green-800: #166534;
      --green-100: #dcfce7;
      --red-700: #b91c1c;
      --red-100: #fee2e2;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--slate-100);
      color: var(--navy-900);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
      color: #ffffff;
      padding: 16px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.2);
    }

    .header-top {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .app-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .app-subtitle {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .save-indicator {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Main Nav Tabs */
    .nav-tabs {
      max-width: 960px;
      margin: 12px auto 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .nav-tab {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 9px 6px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .nav-tab.active {
      background: #ffffff;
      color: var(--navy-900);
      border-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 12px;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* Day Strip */
    .day-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(76px, 1fr));
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .day-pill {
      background: #ffffff;
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 76px;
    }

    .day-pill.active {
      background: var(--navy-800);
      border-color: var(--navy-800);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .day-pill .wk {
      font-size: 0.88rem;
      font-weight: 700;
      display: block;
    }

    .day-pill .dt {
      font-size: 0.72rem;
      opacity: 0.8;
      display: block;
      margin-top: 1px;
    }

    .day-pill .tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--slate-100);
      color: var(--slate-600);
      font-weight: 600;
    }

    .day-pill.active .tag {
      background: rgba(255, 255, 255, 0.18);
      color: #f8fafc;
    }

    /* Day Summary Banner */
    .day-summary-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
    }

    .day-module-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy-900);
      margin: 0 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .completion-pill {
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--teal-50);
      color: var(--teal-700);
      border: 1px solid var(--teal-100);
      font-weight: 700;
    }

    .track-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (max-width: 600px) {
      .track-mini-grid {
        grid-template-columns: 1fr;
      }
    }

    .mini-box {
      padding: 9px 11px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
    }

    .mini-box.strength {
      background: var(--teal-50);
      border: 1px solid var(--teal-100);
      color: var(--teal-700);
    }

    .mini-box.walk {
      background: var(--sky-50);
      border: 1px solid var(--sky-200);
      color: var(--sky-700);
    }

    .mini-box.cardio {
      background: var(--rose-50);
      border: 1px solid var(--rose-200);
      color: var(--rose-700);
    }

    .mini-box .lbl {
      font-size: 0.73rem;
      font-weight: 600;
      opacity: 0.88;
      display: block;
    }

    .mini-box .val {
      font-size: 0.96rem;
      font-weight: 700;
      margin-top: 2px;
      display: block;
    }

    /* Section Headers inside Day View */
    .track-section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 8px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .track-section-hdr.walk-hdr {
      background: var(--sky-50);
      color: var(--sky-700);
      border-left: 4px solid var(--sky-700);
    }

    .track-section-hdr.sport-hdr {
      background: var(--orange-50);
      color: var(--orange-700);
      border-left: 4px solid var(--orange-700);
    }

    .track-section-hdr.strength-hdr {
      background: var(--slate-200);
      color: var(--navy-800);
      border-left: 4px solid var(--navy-800);
    }

    .track-section-hdr.custom-hdr {
      background: var(--violet-50);
      color: var(--violet-700);
      border-left: 4px solid var(--violet-700);
    }

    .track-section-hdr.cardio-hdr {
      background: var(--rose-50);
      color: var(--rose-700);
      border-left: 4px solid var(--rose-700);
    }

    /* Exercise & Track Cards */
    .ex-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease;
    }

    .ex-card.status-done,
    .ex-card.walk-card.status-done,
    .ex-card.sport-card.status-done,
    .ex-card.cardio-card.status-done,
    .ex-card.custom-card.status-done {
      background: #e5e7eb;
      border-color: #cbd5e1;
      border-left: 5px solid var(--teal-600);
      opacity: 0.8;
    }

    .ex-card.status-done .ex-name {
      color: #475569;
    }

    .ex-card.status-done .meta-chip {
      background: #cbd5e1;
      color:
