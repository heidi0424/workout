<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="訓練動態追蹤" />
  <meta name="theme-color" content="#1e293b" />
  <title>訓練菜單與動態追蹤系統</title>
  <style>
    :root {
      --navy-900: #0f172a;
      --navy-800: #1e293b;
      --navy-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;
      --teal-700: #0f766e;
      --teal-600: #0d9488;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --sky-700: #0369a1;
      --sky-200: #bae6fd;
      --sky-50: #eff6ff;
      --rose-700: #be123c;
      --rose-200: #fecdd3;
      --rose-50: #fff1f2;
      --violet-700: #6d28d9;
      --violet-200: #ddd6fe;
      --violet-50: #f5f3ff;
      --amber-800: #92400e;
      --amber-200: #fde68a;
      --amber-50: #fffbeb;
      --orange-700: #c2410c;
      --orange-200: #fed7aa;
      --orange-50: #fff7ed;
      --green-800: #166534;
      --green-100: #dcfce7;
      --red-700: #b91c1c;
      --red-100: #fee2e2;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 7px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--slate-100);
      color: var(--navy-900);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    .app-header {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 100%);
      color: #ffffff;
      padding: 16px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.2);
    }

    .header-top {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .app-title {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .app-subtitle {
      margin: 2px 0 0;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .save-indicator {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .nav-tabs {
      max-width: 960px;
      margin: 12px auto 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .nav-tab {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 9px 6px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .nav-tab.active {
      background: #ffffff;
      color: var(--navy-900);
      border-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    #photoSignIn[hidden], #photoSignOut[hidden] {
      display: none;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 12px;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .week-switcher {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .week-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .week-pill {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1.5px solid var(--slate-300);
      background: var(--slate-50);
      color: var(--navy-800);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .week-pill.active {
      background: var(--teal-700);
      border-color: var(--teal-700);
      color: #ffffff;
    }

    .day-strip {
      display: grid;
      grid-template-columns: repeat(7, minmax(76px, 1fr));
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .day-pill {
      background: #ffffff;
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 76px;
    }

    .day-pill.active {
      background: var(--navy-800);
      border-color: var(--navy-800);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .day-pill.is-today:not(.active) {
      border-color: var(--teal-600);
      background: var(--teal-50);
    }

    .day-pill .wk {
      font-size: 0.88rem;
      font-weight: 700;
      display: block;
    }

    .day-pill .dt {
      font-size: 0.72rem;
      opacity: 0.8;
      display: block;
      margin-top: 1px;
    }

    .day-pill .tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--slate-100);
      color: var(--slate-600);
      font-weight: 600;
    }

    .day-pill.active .tag {
      background: rgba(255, 255, 255, 0.18);
      color: #f8fafc;
    }

    .day-summary-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
    }

    .day-module-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy-900);
      margin: 0 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .completion-pill {
      font-size: 0.8rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--teal-50);
      color: var(--teal-700);
      border: 1px solid var(--teal-100);
      font-weight: 700;
    }

    .track-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    @media (max-width: 600px) {
      .track-mini-grid {
        grid-template-columns: 1fr;
      }
    }

    .mini-box {
      padding: 9px 11px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
    }

    .mini-box.walk {
      background: var(--sky-50);
      border: 1px solid var(--sky-200);
      color: var(--sky-700);
    }

    .mini-box.strength {
      background: var(--teal-50);
      border: 1px solid var(--teal-100);
      color: var(--teal-700);
    }

    .mini-box.cardio {
      background: var(--rose-50);
      border: 1px solid var(--rose-200);
      color: var(--rose-700);
    }

    .mini-box .lbl {
      font-size: 0.73rem;
      font-weight: 600;
      opacity: 0.88;
      display: block;
    }

    .mini-box .val {
      font-size: 0.96rem;
      font-weight: 700;
      margin-top: 2px;
      display: block;
    }

    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 8px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .section-hdr.walk-hdr {
      background: var(--sky-50);
      color: var(--sky-700);
      border-left: 4px solid var(--sky-700);
    }

    .section-hdr.strength-hdr {
      background: var(--slate-200);
      color: var(--navy-800);
      border-left: 4px solid var(--navy-800);
    }

    .section-hdr.cardio-hdr {
      background: var(--rose-50);
      color: var(--rose-700);
      border-left: 4px solid var(--rose-700);
    }

    .ex-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease;
    }

    .ex-card.walk-card {
      background: #fafdff;
      border-color: var(--sky-200);
    }

    .ex-card.sport-card {
      background: #fffcf7;
      border-color: var(--orange-200);
    }

    .ex-card.cardio-card {
      background: #fff9fa;
      border-color: var(--rose-200);
    }

    .ex-card.custom-card {
      background: #fcfaff;
      border-color: var(--violet-200);
    }

    .ex-card.status-skip {
      border-left: 5px solid #d97706;
      opacity: 0.85;
    }

    .ex-card.status-done,
    .ex-card.walk-card.status-done,
    .ex-card.sport-card.status-done,
    .ex-card.cardio-card.status-done,
    .ex-card.custom-card.status-done {
      background: #e5e7eb !important;
      border-color: #cbd5e1 !important;
      border-left: 5px solid var(--teal-600) !important;
      opacity: 0.84;
    }

    .ex-card.status-done .ex-name {
      color: #475569;
    }

    .ex-card.status-done .meta-chip {
      background: #cbd5e1;
      color: #475569;
    }

    .ex-card.status-done .cue-box {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #64748b;
    }

    .ex-card.status-done .calc-strip,
    .ex-card.walk-card.status-done .calc-strip,
    .ex-card.sport-card.status-done .calc-strip,
    .ex-card.cardio-card.status-done .calc-strip {
      background: #cbd5e1 !important;
      border-color: #94a3b8 !important;
      color: #334155 !important;
    }

    .ex-card.status-done .ctrl-input:disabled,
    .ex-card.status-done .ctrl-select:disabled,
    .ex-card.walk-card.status-done .ctrl-input:disabled,
    .ex-card.sport-card.status-done .ctrl-input:disabled,
    .ex-card.sport-card.status-done .ctrl-select:disabled,
    .ex-card.cardio-card.status-done .ctrl-input:disabled,
    .ex-card.cardio-card.status-done .ctrl-select:disabled,
    .ex-card.custom-card.status-done .ctrl-input:disabled,
    .ex-card.custom-card.status-done .ctrl-select:disabled,
    .ex-card.status-done .unit-btn:disabled,
    .ex-card.status-done .preset-pill:disabled,
    .ex-card.status-done .btn:disabled {
      background: #cbd5e1 !important;
      border-color: #94a3b8 !important;
      color: #475569 !important;
      -webkit-text-fill-color: #475569;
      cursor: not-allowed;
      opacity: 0.88;
    }

    .lock-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: #cbd5e1;
      color: #334155;
      margin-left: 4px;
      vertical-align: middle;
    }

    .prev-record-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--amber-50);
      border: 1px solid var(--amber-200);
      color: var(--amber-800);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    .phase-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--slate-100);
      color: var(--slate-600);
      margin-bottom: 4px;
    }

    .phase-badge.walk {
      background: var(--sky-50);
      color: var(--sky-700);
      border: 1px solid var(--sky-200);
    }

    .phase-badge.sport {
      background: var(--orange-50);
      color: var(--orange-700);
      border: 1px solid var(--orange-200);
    }

    .phase-badge.cardio {
      background: var(--rose-50);
      color: var(--rose-700);
      border: 1px solid var(--rose-200);
    }

    .phase-badge.custom {
      background: var(--violet-50);
      color: var(--violet-700);
      border: 1px solid var(--violet-200);
    }

    .ex-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .status-select {
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--slate-300);
      font-size: 0.84rem;
      font-weight: 700;
      background: #ffffff;
      color: var(--navy-900);
      cursor: pointer;
      min-height: 38px;
    }

    .status-select.done {
      background: var(--green-100);
      border-color: #86efac;
      color: var(--green-800);
    }

    .status-select.skip {
      background: var(--amber-50);
      border-color: var(--amber-200);
      color: var(--amber-800);
    }

    .status-select.none {
      background: var(--slate-100);
      border-color: var(--slate-300);
      color: var(--slate-600);
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .meta-chip {
      font-size: 0.76rem;
      background: var(--slate-100);
      color: var(--navy-700);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .cue-box {
      font-size: 0.82rem;
      color: var(--slate-600);
      background: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      margin-bottom: 10px;
    }

    .cue-box strong {
      color: var(--navy-800);
    }

    .yt-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--sky-700);
      text-decoration: none;
      background: var(--sky-50);
      border: 1px solid var(--sky-200);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 8px;
      align-items: end;
    }

    .input-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-items: end;
    }

    @media (max-width: 520px) {
      .input-grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field-group label {
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--slate-600);
    }

    .ctrl-input, .ctrl-select, .ctrl-textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--slate-300);
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      font-family: inherit;
      background: var(--amber-50);
      color: var(--navy-900);
      min-height: 40px;
    }

    .walk-card .ctrl-input {
      background: var(--sky-50);
      border-color: var(--sky-200);
    }

    .sport-card .ctrl-input, .sport-card .ctrl-select, .sport-card .ctrl-textarea {
      background: var(--orange-50);
      border-color: var(--orange-200);
    }

    .cardio-card .ctrl-input, .cardio-card .ctrl-select {
      background: var(--rose-50);
      border-color: var(--rose-200);
    }

    .ctrl-input:focus, .ctrl-select:focus, .ctrl-textarea:focus {
      outline: none;
      border-color: var(--teal-600);
      background: #ffffff;
    }

    .weight-unit-row {
      display: flex;
      gap: 4px;
    }

    .unit-btn {
      padding: 0 10px;
      border: 1.5px solid var(--slate-300);
      border-radius: var(--radius-sm);
      background: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--navy-800);
      cursor: pointer;
      min-height: 40px;
      min-width: 48px;
    }

    .unit-btn.lb {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #1e40af;
    }

    .calc-strip {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: var(--teal-50);
      border: 1px solid var(--teal-100);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--teal-700);
      font-weight: 700;
    }

    .calc-strip.walk-calc {
      background: var(--sky-50);
      border-color: var(--sky-200);
      color: var(--sky-700);
    }

    .calc-strip.sport-calc {
      background: var(--orange-50);
      border-color: var(--orange-200);
      color: var(--orange-700);
    }

    .calc-strip.cardio-calc {
      background: var(--rose-50);
      border-color: var(--rose-200);
      color: var(--rose-700);
    }

    .warn-banner {
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      background: var(--red-100);
      color: var(--red-700);
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid #fecaca;
    }

    .preset-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .preset-pill {
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--rose-200);
      background: #ffffff;
      color: var(--rose-700);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid transparent;
      font-size: 0.86rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      min-height: 40px;
    }

    .btn-primary {
      background: var(--navy-800);
      color: #ffffff;
    }

    .btn-teal {
      background: var(--teal-700);
      color: #ffffff;
    }

    .btn-outline {
      background: #ffffff;
      border-color: var(--slate-300);
      color: var(--navy-800);
    }

    .btn-danger {
      background: #ffffff;
      border-color: #fecaca;
      color: var(--red-700);
    }

    .btn-sm {
      padding: 4px 9px;
      font-size: 0.76rem;
      min-height: 30px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-card .k-title {
      font-size: 0.78rem;
      color: var(--slate-600);
      font-weight: 700;
    }

    .kpi-card .k-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--navy-900);
      margin: 4px 0 2px;
    }

    .kpi-card .k-sub {
      font-size: 0.75rem;
      color: var(--slate-500);
    }

    .panel-card {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      padding: 15px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .panel-title {
      margin: 0 0 12px;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--navy-900);
      border-bottom: 1px solid var(--slate-200);
      padding-bottom: 8px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 92px 1fr 124px;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .bar-track {
      height: 16px;
      background: var(--slate-100);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .bar-fill.teal { background: var(--teal-600); }
    .bar-fill.sky { background: var(--sky-700); }
    .bar-fill.rose { background: var(--rose-700); }

    .table-wrap {
      overflow-x: auto;
    }

    table.summary-tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 740px;
    }

    table.summary-tbl th {
      background: var(--navy-700);
      color: #ffffff;
      padding: 8px 6px;
      text-align: center;
      font-weight: 700;
    }

    table.summary-tbl td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--slate-200);
      text-align: center;
    }

    table.summary-tbl tr:nth-child(even) td {
      background: var(--slate-50);
    }

    .star-row {
      display: flex;
      gap: 4px;
    }

    .star-btn {
      font-size: 1.3rem;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      color: var(--slate-300);
    }

    .star-btn.active {
      color: #f59e0b;
    }

    .machine-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .machine-item {
      background: #ffffff;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .machine-thumb {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: var(--slate-100);
      cursor: zoom-in;
    }

    .machine-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-img {
      max-width: 100%;
      max-height: 86vh;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy-900);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 120;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.25);
      display: none;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div>
        <h1 class="app-title">訓練菜單與動態追蹤系統</h1>
        <p class="app-subtitle" id="appSubtitle">正在連線雲端試算表載入最新課表...</p>
      </div>
      <span class="save-indicator" id="saveStatus" role="status">準備中</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="tab-schedule">📋 每日課表</button>
      <button class="nav-tab" data-tab="tab-machines">📸 器械收藏庫</button>
      <button class="nav-tab" data-tab="tab-overview">📊 總覽統計</button>
    </nav>
  </header>

  <main class="container">
    <!-- TAB 1: DAILY SCHEDULE -->
    <section id="tab-schedule" class="tab-panel active">
      <div class="week-switcher" id="weekSwitcherBar"></div>
      <div class="day-strip" id="dayStrip"></div>
      <div class="day-summary-card" id="daySummaryCard"></div>
      <div id="scheduleContainer"></div>
    </section>

    <!-- TAB 2: MACHINE LIBRARY -->
    <section id="tab-machines" class="tab-panel">
      <div class="panel-card">
        <p id="photoSyncStatus" role="status">正在檢查照片同步…</p>
        <a class="btn btn-outline btn-sm" id="photoSignIn" href="/api/photos?action=login" hidden>使用 Google 帳號啟用照片同步</a>
        <button class="btn btn-outline btn-sm" type="button" id="photoSignOut" hidden>登出照片同步</button>
      </div>
      <div class="panel-card">
        <h2 class="panel-title" id="machineFormTitle">📸 新增感受良好的健身房器械（拍照登錄供日後排課）</h2>
        <div class="input-grid" style="grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));">
          <div class="field-group">
            <label>器材名稱 / 品牌 *</label>
            <input type="text" id="mName" class="ctrl-input" placeholder="例：鐘擺深蹲機 / Matrix 坐姿推胸" />
          </div>
          <div class="field-group">
            <label>歸類訓練日 / 動作模式</label>
            <select id="mCategory" class="ctrl-select">
              <option value="拉日（背/二頭）">拉日（背/二頭）</option>
              <option value="腿日（股四頭/臀腿）">腿日（股四頭/臀腿）</option>
              <option value="推日（胸/肩/三頭）">推日（胸/肩/三頭）</option>
              <option value="有氧與功能器械">有氧與功能器械</option>
            </select>
          </div>
          <div class="field-group">
            <label>發力感受評分</label>
            <div class="star-row" id="mStarRow"></div>
          </div>
        </div>

        <div class="input-grid" style="margin-top:10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));">
          <div class="field-group">
            <label>座椅 / 靠墊 / 握距調整參數</label>
            <input type="text" id="mSetup" class="ctrl-input" placeholder="例：椅墊第 4 格、胸墊第 2 格、寬握把" />
          </div>
          <div class="field-group">
            <label>器材拍照 / 上傳照片（自動壓縮省空間）</label>
            <input type="file" id="mPhotoInput" accept="image/*" capture="environment" class="ctrl-input" style="padding:6px;" />
          </div>
        </div>

        <div id="mPhotoPreviewWrap" style="margin-top:8px; display:none; align-items:center; gap:10px;">
          <img id="mPhotoPreview" src="" alt="預覽" style="width:84px; height:84px; object-fit:cover; border-radius:8px; border:1px solid #cbd5e1;" />
          <button type="button" class="btn btn-danger btn-sm" id="mClearPhotoBtn">移除照片</button>
        </div>

        <div class="field-group" style="margin-top:10px;">
          <label>發力感受與體態筆記（肋骨下沉、是否代償下背等）</label>
          <textarea id="mNotes" rows="2" class="ctrl-textarea" placeholder="例：胸墊頂住後完全不會借用下背，闊背肌收縮感非常集中。"></textarea>
        </div>

        <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;">
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn btn-teal" id="mSaveBtn">💾 儲存至器械收藏庫</button>
            <button type="button" class="btn btn-outline" id="mCancelEditBtn" style="display:none;">取消編輯</button>
          </div>
          <button type="button" class="btn btn-primary" id="copyMachinesBtn">📋 一鍵複製給教練排課</button>
        </div>
      </div>

      <div class="preset-pills" id="machineFilterRow"></div>
      <div class="machine-grid" id="machineListContainer"></div>
    </section>

    <!-- TAB 3: OVERVIEW & CHARTS -->
    <section id="tab-overview" class="tab-panel">
      <div class="week-switcher" id="overviewWeekSwitcherBar"></div>
      <div class="kpi-grid" id="overviewKpiGrid"></div>

      <div class="panel-card">
        <h2 class="panel-title">跨週總量趨勢對比（所有歷史週次）</h2>
        <div id="chartCrossWeek"></div>
      </div>

      <div class="panel-card">
        <h2 class="panel-title">圖表 A｜當週每日重訓總容量 Volume（kg）</h2>
        <div id="chartStrength"></div>
      </div>

      <div class="panel-card">
        <h2 class="panel-title">圖表 B｜當週每日日常步行 NEAT 距離（km）與均速</h2>
        <div id="chartWalk"></div>
      </div>

      <div class="panel-card">
        <h2 class="panel-title">圖表 C｜當週每日有氧與專項總時長（分鐘）</h2>
        <div id="chartCardio"></div>
      </div>

      <div class="panel-card">
        <h2 class="panel-title" id="overviewTableTitle">當週訓練數據彙總表</h2>
        <div class="table-wrap" id="overviewTableWrap"></div>
      </div>

      <div class="panel-card">
        <h2 class="panel-title">🔍 歷史動作負重與容量成長查詢（全歷史資料庫）</h2>
        <div class="field-group" style="max-width:360px; margin-bottom:10px;">
          <label>選擇要檢視歷史紀錄的動作</label>
          <select id="historyExerciseSelect" class="ctrl-select"></select>
        </div>
        <div class="table-wrap" id="historyExerciseWrap"></div>
      </div>
      <details class="panel-card">
        <summary>備份與匯出</summary>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <button type="button" class="btn btn-outline" id="exportCsvBtn">📥 匯出全歷史 CSV（含 UTF-8 BOM）</button>
          <button type="button" class="btn btn-outline" id="exportJsonBtn">📦 匯出完整 JSON 備份</button>
          <button type="button" class="btn btn-outline" id="exportPreSyncBtn" hidden>下載啟用自動同步前的本機課表</button>
          <label class="btn btn-outline" style="cursor:pointer;">
            📂 匯入 JSON 還原
            <input type="file" id="importJsonInput" accept=".json" style="display:none;" />
          </label>
        </div>
      </details>
    </section>
  </main>

  <div class="modal-backdrop" id="imgModal">
    <img src="" alt="器材放大檢視" class="modal-img" id="modalImgEl" />
  </div>

  <div class="toast" id="toastEl"></div>

  <script src="/app.js" defer></script>
</body>
</html>
